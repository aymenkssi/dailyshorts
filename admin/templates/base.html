<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Daily Shorts{% endblock %} · Administration</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header><div class="bar">
  {% set parts = channel.split(' ', 1) %}<a class="brand" href="/">{{ parts[0] }}{% if parts|length > 1 %} <b>{{ parts[1] }}</b>{% endif %}</a>
  <nav>
    <a href="/" class="{{ 'on' if active == 'dashboard' }}">Tableau de bord</a>
    <a href="/videos" class="{{ 'on' if active in ('videos', 'day') }}">Vidéos</a>
    <a href="/sujets" class="{{ 'on' if active == 'topics' }}">Sujets</a>
    <a href="/coloriages" class="{{ 'on' if active == 'coloring' }}">Coloriages</a>
    <a href="/stats" class="{{ 'on' if active == 'stats' }}">Statistiques</a>
    <a href="/comptes" class="{{ 'on' if active == 'accounts' }}">Comptes</a>
    <a href="/reglages" class="{{ 'on' if active == 'settings' }}">Réglages</a>
    <a href="/journal" class="{{ 'on' if active == 'journal' }}">Journal</a>
    <a href="{{ llm_url }}" target="_blank" rel="noopener">FreeLLMAPI ↗</a>
  </nav>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="mini">Déconnexion</button></form>
</div></header>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
