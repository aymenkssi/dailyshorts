<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · {{ channel }}</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="login"><div class="card">
<h1>{{ channel }}</h1><p class="mute">Administration</p>
<form method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}">
<label for="pw">Mot de passe</label>
<input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<div class="actions"><button class="primary">Se connecter</button></div>
</form></div></div></body></html>
