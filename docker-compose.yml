# Daily Shorts — même organisation que Waselni : Docker Compose derrière le Traefik du VPS
# (réseau externe "web", entrée "websecure", certificats "letsencrypt").
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: dailyshorts-freellmapi
    restart: always
    env_file:
      - ./freellmapi.env
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: 1          # un seul proxy devant : Traefik
    # Accès local (tunnel SSH), en secours si l'admin est indisponible
    ports:
      - "127.0.0.1:${FREELLMAPI_PORT:-3001}:3001"
    volumes:
      - freellmapi_data:/app/server/data
    networks:
      - internal
      - web
    # Tableau de bord publié sur LLM_DOMAIN, mais Traefik demande d'abord à l'admin si le
    # visiteur est connecté (forwardAuth) ; FreeLLMAPI garde ensuite son propre mot de passe.
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.dailyshorts-llm.rule=Host(`${LLM_DOMAIN:-llm.daily.creationapp.academy}`)
      - traefik.http.routers.dailyshorts-llm.entrypoints=websecure
      - traefik.http.routers.dailyshorts-llm.tls.certresolver=letsencrypt
      - traefik.http.routers.dailyshorts-llm.middlewares=dailyshorts-admin-auth
      - traefik.http.middlewares.dailyshorts-admin-auth.forwardauth.address=http://dailyshorts-admin:8000/auth/check
      - traefik.http.services.dailyshorts-llm.loadbalancer.server.port=3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  shorts:
    build: .
    container_name: dailyshorts-pipeline
    restart: always
    env_file:
      - ./.env
    environment:
      LLM_BASE_URL: http://freellmapi:3001/v1
      PUBLIC_VIDEO_DIR: /public
    volumes:
      - ./state:/app/state
      - ./output:/app/output
      - ./public:/public
      - ./assets/music:/app/assets/music:ro
      - kokoro_cache:/app/cache
    depends_on:
      freellmapi:
        condition: service_healthy
    networks:
      - internal

  # Interface d'administration : réglages, sujets, validation, historique, statistiques
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: dailyshorts-admin
    restart: always
    env_file:
      - ./admin.env            # ADMIN_PASSWORD_HASH et SESSION_SECRET (tools/admin_password.py)
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-daily.creationapp.academy}
      LLM_DOMAIN: ${LLM_DOMAIN:-llm.daily.creationapp.academy}
      CHANNEL_NAME: ${CHANNEL_NAME:-Anime Storytelling}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}        # affiché sur les pages /terms et /privacy
      # uniquement ce qu'il faut pour lire les statistiques (pas les clés de génération)
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_GRAPH_VERSION: ${IG_GRAPH_VERSION:-v23.0}
      IG_GRAPH_HOST: ${IG_GRAPH_HOST:-graph.facebook.com}
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_ACCESS_TOKEN: ${FB_ACCESS_TOKEN:-}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-}
      # connexion TikTok depuis la page Comptes (Login Kit)
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_TOKEN_FILE: ${TIKTOK_TOKEN_FILE:-state/tiktok_token.json}
      TIKTOK_SCOPES: ${TIKTOK_SCOPES:-user.info.basic,user.info.stats,video.list,video.upload}
    volumes:
      - ./state:/app/state
      - ./output:/app/output
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.dailyshorts-admin.rule=Host(`${ADMIN_DOMAIN:-daily.creationapp.academy}`)
      - traefik.http.routers.dailyshorts-admin.entrypoints=websecure
      - traefik.http.routers.dailyshorts-admin.tls.certresolver=letsencrypt
      - traefik.http.services.dailyshorts-admin.loadbalancer.server.port=8000

  # Sert /shorts/*.mp4 pour qu'Instagram et Facebook puissent télécharger la vidéo du jour
  media:
    image: nginx:alpine
    container_name: dailyshorts-media
    restart: always
    volumes:
      - ./public:/usr/share/nginx/html/shorts:ro
      - ./deploy/media-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.dailyshorts-media.rule=Host(`${SHORTS_DOMAIN:-aymendridi.com}`) && PathPrefix(`/shorts/`)
      - traefik.http.routers.dailyshorts-media.priority=100
      - traefik.http.routers.dailyshorts-media.entrypoints=websecure
      - traefik.http.routers.dailyshorts-media.tls.certresolver=letsencrypt
      - traefik.http.services.dailyshorts-media.loadbalancer.server.port=80

volumes:
  freellmapi_data:
  kokoro_cache:

networks:
  web:
    external: true
  internal:
    driver: bridge
